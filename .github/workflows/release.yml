name: Build and publish release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            build: dist:mac
          - os: windows-latest
            target: win
            build: dist:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/validate-release.cjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:editor
      - run: npm run test:studio
      - run: npm run ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/prepare-release.cjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-upload/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-test-results-${{ matrix.target }}
          path: test-results/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-upload/
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/validate-release.cjs
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-upload/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file .github/RELEASE-NOTES.md
          else
            gh release create "$RELEASE_TAG" release-upload/* --verify-tag --title "Checkpoint Studio $RELEASE_TAG" --notes-file .github/RELEASE-NOTES.md
          fi
